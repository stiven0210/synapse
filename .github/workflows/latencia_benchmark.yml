name: Latency benchmark (cloud validation)

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run latency benchmark (Domain 1, synthetic, no dependency on large datasets)
        run: python -m pytest tests/test_ejecutor.py -k latencia -s -v
      - name: Run full suite (informational -- tests that need large datasets skip themselves)
        run: python -m pytest -q
